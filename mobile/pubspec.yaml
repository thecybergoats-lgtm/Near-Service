name: near_service
description: "Near Service — local services marketplace for Pakistan (Quetta launch). InDrive-style bidding for Book Binding, AC Repair, Electrician, Plumber, Mobile Repair."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  http: ^1.2.2
  socket_io_client: ^2.0.3+1
  flutter_secure_storage: ^9.2.2
  geolocator: ^12.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  cached_network_image: ^3.4.1
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.1
  uuid: ^4.4.2
  speech_to_text: ^7.4.0
  image_picker: ^1.1.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  share_plus: ^10.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
