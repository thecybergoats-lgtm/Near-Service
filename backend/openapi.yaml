    post:
      tags:
      - AI Gateway
      operationId: photoSearch
      summary: Suggest a category from a photo description/tags (heuristic, not vision)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhotoSearchRequest'
      responses:
        '201':
          description: Ranked category suggestions (best first, max 3)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoSearchResult'
        '422':
          $ref: '#/components/responses/ValidationError'
