  # ---- Risk engine (item 2) -------------------------------------------
  # Scores are admin/support-visible only — never customer-visible, and
  # blocking is never automatic: a score >= block_threshold only flags the
  # account for admin review (risk_scores.hold_until).
  /risk/me:
    get:
      tags:
      - Risk
      operationId: myRiskScore
      summary: My own risk score (never 404s — a never-scored user gets 0/low)
      responses:
        '200':
          description: Stored risk score with breakdown and thresholds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskScore'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /risk/users/{userId}:
    get:
      tags:
      - Risk
      operationId: getRiskUser
      summary: Risk score for one user (super_admin / support_agent)
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Stored risk score with breakdown and thresholds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskScore'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /risk/users/{userId}/recompute:
    post:
      tags:
      - Risk
      operationId: recomputeRisk
      summary: Recompute a user's risk score from current signals (super_admin / support_agent)
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '201':
          description: Recomputed risk score (change audited via audit_logs)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskScore'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /risk/users/{userId}/events:
    get:
      tags:
      - Risk
      operationId: listRiskEvents
      summary: A user's risk events, newest first (super_admin / support_agent)
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: signal
        in: query
        required: false
        schema:
          type: string
          enum: [cancellation, no_show, upheld_dispute, device_change, sim_change, mock_location, teleport, duplicate_account, payout_account_reuse, velocity, report, ledger_anomaly]
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Risk events page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskEventPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /risk/events:
    post:
      tags:
      - Risk
      operationId: recordRiskEvent
      summary: Record one operator-reported risk signal (recomputes the score immediately)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordRiskEventRequest'
      responses:
        '201':
          description: Recorded event + recomputed score
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordRiskEventResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /risk/users/{userId}/ranking-penalty:
    get:
      tags:
      - Risk
      operationId: rankingPenalty
      summary: Stored-score ranking penalty for one user (read-only; never recomputes)
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Ranking penalty derived from the stored score (0 below the review threshold, rising to 0.5 at score 100)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RankingPenalty'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /risk/jobs/{jobId}:
