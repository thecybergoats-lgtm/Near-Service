  # ---- Phase 3 (v1.5) -------------------------------------------------
  # AI Gateway (items 1 + 9): local provider only — no vendor, no key.
  # Voice search has no STT on the local provider: audio-only requests
  # fail honestly with 422 STT_UNAVAILABLE; a client-supplied transcript
  # (on-device speech recognition) works. Photo search is a heuristic
  # keyword match on description/tags/filename — NOT image recognition.
  /ai/health:
    get:
      tags:
      - AI Gateway
      operationId: aiHealth
      summary: AI gateway health — provider name + capabilities
      security: []
      responses:
        '200':
          description: Provider + capabilities of the configured AI provider (local)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiHealth'
  /ai/intent:
    post:
      tags:
      - AI Gateway
      operationId: parseIntent
      summary: Parse free text into a service intent (PII redacted first)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParseIntentRequest'
      responses:
        '201':
          description: Parsed intent (service + confidence; fallback_to_keyword_search=true when parsing failed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParsedIntent'
        '422':
          $ref: '#/components/responses/ValidationError'
