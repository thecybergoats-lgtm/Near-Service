      type: object
      required:
      - auto_translate
      properties:
        target_lang:
          type: string
          enum: [ur, en]
        auto_translate:
          type: boolean
          description: Requires target_lang (422 TRANSLATION_TARGET_REQUIRED when auto_translate is true without one).
    TranslateMessageRequest:
