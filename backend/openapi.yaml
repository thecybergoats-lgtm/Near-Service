      type: object
      description: Amounts in PKR here (the controller converts to paisa for storage).
      properties:
        auto_release_hours:
          type: integer
          minimum: 1
          maximum: 720
        min_amount_pkr:
          type: number
          minimum: 0
          maximum: 10000000
        payout_fee_flat_pkr:
          type: number
          minimum: 0
          maximum: 10000
        payout_fee_rate:
          type: number
          minimum: 0
          maximum: 0.5
        payout_tax_rate:
          type: number
          minimum: 0
          maximum: 0.5
    RejectPayoutRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
    AutoReleaseResult:
      type: object
      required:
      - released
      - skipped_dispute
      - checked_at
      properties:
        released:
          type: array
          items:
            type: string
            format: uuid
        skipped_dispute:
          type: array
          items:
            type: string
            format: uuid
          description: Holds left held because a dispute is open on the job.
        checked_at:
          type: string
          format: date-time
    RunDuePayoutsResult:
      type: object
      required:
      - executed
      - failed
      - checked_at
      properties:
        executed:
          type: array
          items:
            type: string
            format: uuid
        failed:
          type: array
          items:
            type: string
            format: uuid
        checked_at:
          type: string
          format: date-time
paths:
  /health:
    get:
      tags:
      - Health
      operationId: getHealth
      security: []
      summary: Liveness probe — 200 whenever the process is up (public, never rate-limited)
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /ready:
    get:
      tags:
      - Health
      operationId: getReady
      security: []
      summary: Readiness probe — 200 only when Postgres and Redis are both up, else 503 (public, never rate-limited; docker-compose backend healthcheck)
      responses:
        '200':
          description: Postgres and Redis are up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
        '503':
          description: Postgres or Redis is down
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
  /auth/otp/request:
    post:
      tags:
      - Auth
      operationId: requestOtp
      security: []
      summary: Send an OTP (Firebase primary; WhatsApp/voice fallback)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
      responses:
        '202':
          description: OTP sent
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/otp/verify:
    post:
      tags:
      - Auth
      operationId: verifyOtp
      security: []
      summary: Verify OTP; creates the account on first verify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/refresh:
    post:
      tags:
      - Auth
      operationId: refreshTokens
      security: []
      summary: Rotate the refresh token (reuse revokes the token family)
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags:
      - Auth
      operationId: logout
      summary: Revoke the refresh-token family
      responses:
        '204':
          description: Logged out
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me:
    get:
      tags:
      - Profile
      operationId: getMe
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags:
      - Profile
      operationId: updateMe
      summary: Update name, language and notification preferences
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
      parameters:
      - &id001
        $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMe'
  /me/profiles:
    get:
      tags:
      - Profile
      operationId: getMyProfiles
      summary: Customer and (if any) provider profile on this one account
      responses:
        '200':
          description: Profiles held by the account
          content:
            application/json:
              schema:
                type: object
                properties:
                  customer:
                    type: boolean
                  provider:
                    $ref: '#/components/schemas/ProviderCard'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/addresses:
    get:
      tags:
      - Profile
      operationId: listAddresses
      responses:
        '200':
          description: Saved addresses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
      parameters:
      - &id005
        $ref: '#/components/parameters/Cursor'
      - &id006
        $ref: '#/components/parameters/Limit'
    post:
      tags:
      - Profile
      operationId: createAddress
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressInput'
      responses:
        '201':
          description: Address saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /me/addresses/{addressId}:
    patch:
      tags:
      - Profile
      operationId: updateAddress
      parameters:
      - name: addressId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - *id001
      responses:
        '200':
          description: Address updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressInput'
  /providers/onboarding:
    post:
      tags:
      - Providers
      operationId: upsertOnboardingStep
      summary: Provider onboarding, one step per call (step 1-3, resumable)
      responses:
        '200':
          description: Onboarding state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingResult'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '422': &id004
          $ref: '#/components/responses/ValidationError'
      requestBody:
        description: Request body
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingStep'
  /providers/me/documents:
    post:
      tags:
      - Providers
      operationId: requestDocumentUpload
      summary: Request a document upload URL (CNIC front/back, selfie, shop photo, certificate)
      responses:
        '200':
          description: Upload URL + storage key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentUploadResponse'
        '401': *id002
        '403': *id003
        '422': *id004
      requestBody:
        description: Request body
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentUploadRequest'
  /providers/me/online:
    patch:
      tags:
      - Providers
      operationId: setProviderOnline
      summary: Set provider online/offline (optionally with live position)
      responses:
        '200':
          description: Online state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetOnlineResponse'
        '401': *id002
        '403': *id003
        '422': *id004
      requestBody:
        description: Request body
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetOnlineRequest'
  /providers/nearby:
    get:
      tags:
      - Discovery
      operationId: nearbyProviders
      summary: Ranked nearby provider cards (PostGIS + Redis GEO)
      parameters:
      - name: lat
        in: query
        required: true
        schema:
          type: number
          minimum: -90
          maximum: 90
      - name: lng
        in: query
        required: true
        schema:
          type: number
          minimum: -180
          maximum: 180
      - name: category_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: UUID. Alternatively pass category_slug; the API resolves the slug to the canonical category UUID.
      - name: category_slug
        in: query
        required: false
        schema:
          type: string
        description: Resolved by the API to the canonical category UUID.
      - name: radius_km
        in: query
        required: false
        schema:
          type: number
          default: 5
          minimum: 0.5
          maximum: 100
      - name: open_now
        in: query
        required: false
        schema:
          type: boolean
      - name: verified_only
        in: query
        required: false
        schema:
          type: boolean
      - *id005
      - *id006
      responses:
        '200':
          description: Ranked provider cards
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /providers/{providerId}:
    get:
      tags:
      - Providers
      operationId: getProvider
      parameters:
      - name: providerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Public provider profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderCard'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /search:
    get:
      tags:
      - Discovery
      operationId: search
      summary: Taxonomy + provider matches; trigram fuzzy, alias-aware
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          maxLength: 200
      - name: lat
        in: query
        required: false
        schema:
          type: number
          minimum: -90
          maximum: 90
      - name: lng
        in: query
        required: false
        schema:
          type: number
          minimum: -180
          maximum: 180
      - name: locale
        in: query
        required: false
        schema:
          type: string
          enum:
          - en
          - ur
          - roman
      - *id005
      - *id006
      responses:
        '200':
          description: Matching categories and providers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResults'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /categories:
    get:
      tags:
      - Discovery
      operationId: listCategories
      security: []
      responses:
        '200':
          description: Taxonomy tree (3 levels)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
      description: 'Returns the full taxonomy tree (3 levels). NOT paginated: the taxonomy is small (tens of nodes), clients need the whole tree to render category pickers, and pagination would break parent/child
        grouping.'
  /categories/{categoryId}/form-schema:
    get:
      tags:
      - Discovery
      operationId: getCategoryFormSchema
      parameters:
      - name: categoryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: JSON Schema for the dynamic request form
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /pricing/fair-range:
    get:
      tags:
      - Discovery
      operationId: getFairRange
      parameters:
      - name: category_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: UUID. Alternatively pass category_slug.
      - name: category_slug
        in: query
        required: false
        schema:
          type: string
        description: Resolved by the API to the canonical category UUID.
      - name: city_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Fair-price range (hidden client-side if sample too small)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FairRange'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /requests:
    post:
      tags:
      - Requests
      operationId: createRequest
      summary: Create a request and start wave broadcast
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequest'
            example:
              category_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
              description: 20 books, hard binding
              specs:
                books: 20
                size: A4
                binding: hard
              fulfillment: PICKUP_DELIVERY
              lat: 30.1798
              lng: 66.975
              customer_offer: 2400
              scheduled_at: null
      responses:
        '201':
          description: Request broadcasting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequest'
        '422':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /requests/{requestId}:
    get:
      tags:
      - Requests
      operationId: getRequest
      parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Request status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /requests/{requestId}/cancel:
    post:
      tags:
      - Requests
      operationId: cancelRequest
      parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Cancelled; any policy fee due is in the response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: CANCELLED
                  fee_due:
                    type: number
                    example: 0
                    minimum: 0
                    description: Cancellation fee due in PKR (0 in Phase 1 before acceptance).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /requests/{requestId}/offers:
    get:
      tags:
      - Requests
      operationId: listOffers
      parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - *id005
      - *id006
      responses:
        '200':
          description: Live offers (also pushed over Socket.IO)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags:
      - Requests
      operationId: createOffer
      summary: Provider accepts at the customer price or counter-offers
      parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOffer'
      responses:
        '201':
          description: Offer recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /offers/{offerId}/accept:
    post:
      tags:
      - Requests
      operationId: acceptOffer
      summary: Customer accepts - atomic job creation; 409 if already closed
      parameters:
      - name: offerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Job created at the locked price
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /offers/{offerId}/counter:
    post:
      tags:
      - Requests
      operationId: counterOffer
      summary: Counter back; maximum round 3, then the offer closes
      parameters:
      - name: offerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CounterOffer'
      responses:
        '201':
          description: Counter-offer recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /offers/{offerId}/decline:
    post:
      tags:
      - Requests
      operationId: declineOffer
      summary: Provider declines; removed from later broadcast waves
      parameters:
      - name: offerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - *id001
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason_code:
                  type: string
      responses:
        '200':
          description: Declined
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /jobs/{jobId}/transition:
    post:
      tags:
      - Jobs
      operationId: transitionJob
      summary: Only legal state-machine moves; writes job_events
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionRequest'
      responses:
        '200':
          description: New job state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
      description: 'Only legal state-machine moves; writes job_events. Illegal moves return 409 ILLEGAL_STATE_TRANSITION.


        Legal transitions:


        | From | To |

        | --- | --- |

        | ACCEPTED | PROVIDER_EN_ROUTE, CUSTOMER_EN_ROUTE, ITEM_PICKED_UP, CANCELLED_BY_CUSTOMER, CANCELLED_BY_PROVIDER |

        | PROVIDER_EN_ROUTE | ARRIVED, CANCELLED_BY_PROVIDER |

        | CUSTOMER_EN_ROUTE | ARRIVED, CANCELLED_BY_CUSTOMER |

        | ITEM_PICKED_UP | IN_PROGRESS, ARRIVED |

        | ARRIVED | IN_PROGRESS, CANCELLED_BY_CUSTOMER, CANCELLED_BY_PROVIDER |

        | IN_PROGRESS | PRICE_ADJUSTMENT_PENDING, COMPLETED, DISPUTED |

        | PRICE_ADJUSTMENT_PENDING | IN_PROGRESS, DISPUTED |

        | COMPLETED | PAYMENT_SETTLED, DISPUTED |

        | PAYMENT_SETTLED | RATED, DISPUTED |

        | DISPUTED | REFUNDED, IN_PROGRESS, COMPLETED |

        | RATED | (terminal) |

        | CANCELLED_BY_CUSTOMER, CANCELLED_BY_PROVIDER, EXPIRED, REFUNDED | (terminal) |'
  /jobs/{jobId}/adjustments:
    post:
      tags:
      - Jobs
      operationId: createAdjustment
      summary: Itemized mid-job price change; needs customer approval
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Adjustment'
      responses:
        '201':
          description: Adjustment pending customer decision
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /adjustments/{adjustmentId}/decide:
    post:
      tags:
      - Jobs
      operationId: decideAdjustment
      parameters:
      - name: adjustmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - approve
              properties:
                approve:
