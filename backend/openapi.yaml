  # ---- Tenders (item 5) -----------------------------------------------
  # Sealed-bid tenders for organisations: quotes are hidden until award.
  # Lead fee: flat PKR 500, charged once from the winning provider's wallet
  # at award (accept quote) — never per quote, never at quote time.
  # Deadline expiry runs via the POST /admin/tenders/expire-due sweep
  # (hourly) plus lazy expiry on a late quote attempt — there is no
  # in-process scheduler in this repo.
  /tenders:
    post:
      tags:
      - Tenders
      operationId: createTender
      summary: Create a tender (organisation customer)
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenderRequest'
      responses:
        '201':
          description: Created tender (OPEN)
          content:
            application/json:
