    # ---- Phase 3 (v1.5) schemas ---------------------------------------
    AiHealth:
      type: object
      required:
      - provider
      - capabilities
      properties:
        provider:
          type: string
          example: local
        capabilities:
          type: object
          properties:
            intent:
              type: boolean
            photo:
              type: boolean
            voiceStt:
              type: boolean
              description: false on the local provider — no speech-to-text model is configured.
            translation:
              type: boolean
    ParseIntentRequest:
      type: object
      required:
      - text
      properties:
        text:
          type: string
          maxLength: 1000
    ParsedIntent:
      type: object
      properties:
        service:
          type:
          - object
          - 'null'
          properties:
            category_id:
              type: string
              format: uuid
            category_slug:
              type: string
            name_en:
              type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        fallbackToKeywordSearch:
          type: boolean
        provider:
          type: string
          example: local
        pii_redacted:
          type: array
          items:
            type: string
          description: Tokens stripped before parsing (phone numbers / CNIC-like / account-like); empty when nothing was redacted.
    PhotoSearchRequest:
      type: object
      description: At least one of description, tags or media_key is required (422 PHOTO_INPUT_REQUIRED otherwise).
      properties:
        media_key:
          type: string
          maxLength: 500
          description: Storage key / filename of the photo. Pixels are never read — the filename text is matched heuristically.
        description:
          type: string
          maxLength: 1000
        tags:
          type: array
          items:
            type: string
            maxLength: 50
    PhotoSearchResult:
      type: object
      required:
      - suggestions
      - method
      - note
      - provider
      properties:
        suggestions:
          type: array
          maxItems: 3
          items:
            type: object
            properties:
              categoryId:
                type: string
                format: uuid
              categorySlug:
                type: string
              nameEn:
                type: string
              confidence:
                type: number
                minimum: 0
                maximum: 1
        method:
          type: string
          example: heuristic-keyword
        note:
          type: string
        provider:
          type: string
          example: local
    VoiceSearchRequest:
      type: object
      properties:
        transcript:
          type: string
          maxLength: 1000
          description: Transcript from on-device speech recognition on the phone.
        audio_key:
          type: string
          maxLength: 500
          description: Storage key of an audio clip — the local provider cannot transcribe it (422 STT_UNAVAILABLE).
        language:
          type: string
          enum: [ur, ur-roman, en]
    VoiceSearchResult:
      type: object
      required:
      - transcript
      - corrected_query
      - intent
      - requires_confirmation
      - provider
      properties:
        transcript:
          type: string
        corrected_query:
          type: string
        intent:
          $ref: '#/components/schemas/ParsedIntent'
        requires_confirmation:
          type: boolean
          description: Always true — the client must show the transcript for manual correction before posting a request.
        provider:
          type: string
          example: local
        pii_redacted:
          type: boolean
    FairPriceEstimate:
      type: object
      required:
      - category_id
      - min
      - typical
      - max
      - sample_size
      - source
      - hidden
      properties:
        category_id:
          type: string
          format: uuid
        city_id:
          type:
          - string
          - 'null'
          format: uuid
        quantity:
          type:
          - integer
          - 'null'
        min:
          type: number
        typical:
          type: number
        max:
          type: number
        sample_size:
          type: integer
        source:
          type: string
          enum: [regression, percentile, empty]
          description: regression = quantity-aware model fit; percentile = thin/flat/noisy sample fallback; empty = no completed-job prices at all.
        r_squared:
          type:
          - number
          - 'null'
        hidden:
          type: boolean
          description: True when the sample is too thin to publish — min/typical/max are then not meaningful.
        provider:
          type: string
          example: local
