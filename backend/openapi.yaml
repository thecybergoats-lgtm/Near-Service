  /jobs/{jobId}/reviews:
    post:
      tags:
      - Jobs
      operationId: createReview
      summary: Only after payment settled; one review per side per job; second review moves the job to RATED
      description: 'Fix B: the job stays PAYMENT_SETTLED after the first review and moves to RATED when both sides have reviewed (job_events records PAYMENT_SETTLED -> RATED, actor = the reviewer whose review completed the pair) or when the review window closes (feature_flags review_window_days, default 7 days from settlement; closed by POST /admin/jobs/close-review-windows). After RATED, or once the window has elapsed, a further review is 409 REVIEW_WINDOW_CLOSED. A reviewer who already reviewed gets 409 ALREADY_REVIEWED. The 201 response carries job_state (PAYMENT_SETTLED or RATED) so the client knows whether the job just closed.'
