x-realtime:
  description: Socket.IO real-time channel (REST docs alone do not cover it). Connect to the Socket.IO gateway with the JWT access token; join rooms request:{requestId}, job:{jobId} and user:{userId}. All
    payloads are JSON.
  transport: Socket.IO over WebSocket (Redis adapter); FCM push wakes closed apps.
  events:
    request.new:
      direction: server -> provider
      room: provider online in category + radius
      payload:
        request_id: uuid
        category_id: uuid
        customer_offer: number (PKR) | null
        lat: number
        lng: number
        expires_at: date-time
    offer.received:
      direction: server -> customer
      room: request:{requestId}
      payload:
        offer: Offer
        request_id: uuid
    offer.updated:
      direction: server -> customer + provider
      room: request:{requestId}
      payload:
        offer: Offer
        round: integer (1-3)
    offer.closed:
      direction: server -> providers whose offer was not accepted
      room: request:{requestId}
      payload:
        request_id: uuid
        reason: accepted_by_other | expired | cancelled
    job.state_changed:
      direction: server -> customer + provider
      room: job:{jobId}
      payload:
        job_id: uuid
        from_state: JobState | null
        to_state: JobState
        at: date-time
    provider.location:
      direction: provider -> server -> customer
      room: job:{jobId}
      payload:
        job_id: uuid
        provider_id: uuid
        lat: number (-90..90)
        lng: number (-180..180)
        eta_minutes: integer | null
    chat.message:
      direction: server -> chat participants
      room: chat:{chatId}
      payload:
        message: Message
    notification:
      direction: server -> user
      room: user:{userId}
      payload:
        type: string
        title: string
        body: string
        job_id: uuid | null
        request_id: uuid | null
    presence.heartbeat:
      direction: provider -> server (while online)
      room: user:{userId}
      payload:
        provider_id: uuid
        lat: number
        lng: number
        is_online: true
        at: date-time
