# Near Service API — OpenAPI 3.1, version 1.6.0 (v1.5.0 + Phase 4 additions).
# Source of truth for the contract test (test/contract/api.contract.spec.ts):
# the set of (method, path) here must equal the routes registered by the Nest app.
openapi: 3.1.0
info:
  title: Near Service API
  version: 1.6.0
  description: 'OpenAPI 3.1 skeleton for the Near Service Phase 1 (MVP) endpoints. Companion to the Phase 0 PRD v1.1. Phase 2 endpoints (wallet, payment intents, payouts, escrow) are intentionally excluded
    and will extend this file. Identifier rule (v1.1): category_id is always a UUID (format: uuid). A client may instead send category_slug; the API resolves the slug to its UUID and echoes the canonical
    UUID in every response.

    v1.2 changes: every list endpoint is cursor-paginated with an {items, next_cursor} envelope; Idempotency-Key added to all mutating marketplace operations (never to auth); standard reusable error responses
    (401/403/404/409/422/429 with Retry-After) and an ErrorCode enum; shared JobState and ServiceRequest status enums with a legal-transition table; lat/lng bounds, PKR price minimums and string/array length
    limits; 10 new Phase 1 endpoint groups (job details/history, waitlist, provider services/service-area/availability, provider reviews, devices, trusted contacts, chat lookup); Socket.IO realtime events
    documented under x-realtime.


    v1.3 changes (Stage 2, FIX 7): v1.2 plus every Phase 2 route that exists in code but was missing from the spec — wallet and gateway top-ups, wallet-paid settlement, promos and referrals, the dispute
    centre admin endpoints, recurring jobs and run-due, job tracking, the full admin surface (KPIs, request queue, suspend, category CRUD, form-schema, commission rules, reconciliation), and the dev-only
    upload receiver. All list endpoints now return the {items, next_cursor} envelope (Page); the two bounded lists that stay bare arrays are GET /me/trusted-contacts (max 5) and GET /providers/me/services,
    as already documented in v1.2. Validation errors are 422 VALIDATION_FAILED everywhere (FIX 6).

    v1.4 changes (Stage 3, FIXES 11-15): GET /health and GET /ready (public, never rate-limited; /ready is the backend healthcheck); POST /disputes/{disputeId}/evidence/upload-request — signed-URL upload for photo evidence, same flow as provider document uploads; GET /chats now served by the messaging module (route unchanged).

    v1.5 changes (Phase 3): v1.4.0 plus every Phase 3 route — AI Gateway (intent / photo / voice search, fair-price model, chat translation), risk engine, subscriptions + teams, tenders (incl. the POST /admin/tenders/expire-due sweep — no in-process scheduler exists in this repo), verification (face-match / liveness / OCR assist, advisory only), and escrow + payouts (sandbox: true on every payout response). Integration points wired: risk penalty + featured Sponsored placement in provider ranking, plan-discounted commission in offer accept, verification evidence attached to the admin verification decision (supporting evidence only — tier upgrades stay officer-gated).

    v1.6 changes (Phase 4): search scale-out (SearchModule providers + metrics/gate admin endpoints + POST /search/click for CTR), analytics warehouse (ETL run/status, funnel, revenue, supply-demand, CSV exports subject to legal review), multi-city ops (admin city CRUD, targets, gate config/evaluations, status, manager assignment, checklist, category overrides, effective commission, commission rules, fair price) + public SEO landing/shop pages (server-rendered HTML), warranty product (opt-in, fee quote/collection at settlement, claims state machine, admin review, config, versioned rules, expiry sweep), partner integrations (parts catalog + orders with affiliate fee and in-app disclosure, admin partner/catalog/order management, fee report). No scheduler exists in this repo: the analytics ETL (02:00 PKT) and warranty expiry sweep run from an external scheduler; see docs/phase4-api-addendum.md.'
  contact:
    name: Near Service engineering
servers:
- url: https://api.nearservice.example/api/v1
  description: Production (placeholder host - set at Phase 1 kickoff)
- url: http://localhost:3000/api/v1
  description: Local development
security:
- bearerAuth: []
tags:
- name: Auth
- name: Profile
- name: Providers
- name: Discovery
- name: Requests
- name: Jobs
- name: Chat
- name: Trust
- name: Admin
- name: Wallet
- name: Promos
- name: Recurring
- name: AI Gateway
- name: Risk
- name: Subscriptions
- name: Teams
- name: Tenders
- name: Verification
- name: Escrow
- name: Analytics
- name: Cities
- name: Warranty
- name: Partners
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 80
      description: Accepted on every mutating marketplace call; a replay with the same key returns the original response instead of duplicating the action. Sending the same key with a different request
        body returns 422 IDEMPOTENCY_KEY_REUSED. NOT used on auth endpoints (OTP request/verify, refresh, logout) — those endpoints never accept this header.
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    Error:
      description: Shared error shape
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or expired access token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Illegal state transition or already-closed offer/request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated but not allowed (admin-only or wrong role for this endpoint)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The resource addressed by the path ID does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Request failed validation (bad body, query or path value)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Rate limit exceeded; wait the Retry-After interval before retrying
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required:
      - error
      - request_id
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              enum:
              - OFFER_EXPIRED
              - OFFER_CLOSED
              - REQUEST_EXPIRED
              - ILLEGAL_STATE_TRANSITION
              - MAX_ROUNDS_REACHED
              - IDEMPOTENCY_KEY_REUSED
              - VALIDATION_FAILED
              - RATE_LIMITED
              - FORBIDDEN
              - NOT_FOUND
              - UNAUTHORIZED
              - REFRESH_REUSE_DETECTED
              - OTP_LOCKED
              - CATEGORY_MISMATCH
              - TRUSTED_CONTACT_LIMIT
              - DOCUMENT_DECIDED
              - DISPUTE_NOT_OPEN
              - CANNOT_CANCEL
              - TOPUP_NOT_CONFIRMABLE
              - GATEWAY_NOT_CONFIRMED
              - NOT_A_TOPUP
              - SELF_REFERRAL
              - ALREADY_REFERRED
              - INVALID_REFERRAL_CODE
              - INVALID_OUTCOME
              - INVALID_REFUND_AMOUNT
              - INVALID_COMPENSATION_AMOUNT
              - CATEGORY_SLUG_EXISTS
              - NO_PROVIDER_PROFILE
              - STORAGE_CONFIGURED
              - INVALID_CATEGORY
              - INVALID_FORM_SCHEMA
              - INVALID_AMOUNT
              - INVALID_PHONE
              - INVALID_PROMO_KIND
              - ILLEGAL_TRANSITION
              description: Machine-readable error code. See components/responses for the HTTP mapping.
              example: OFFER_EXPIRED
            message:
              type: string
            details:
              type: object
              additionalProperties: true
        request_id:
          type: string
      example:
        error:
          code: OFFER_EXPIRED
          message: This offer has expired.
          details:
            offer_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        request_id: req_01J8ZQ7K2X
    Page:
      type: object
      properties:
        next_cursor:
          type:
          - string
          - 'null'
      description: Base pagination envelope. Concrete *Page schemas add an items array via allOf. Clients pass the returned next_cursor as ?cursor= to fetch the next page; next_cursor is null on the last
        page.
    OtpRequest:
      type: object
      required:
      - phone
      properties:
        phone:
          type: string
          pattern: ^\+92\d{10}$
          example: '+923001234567'
    OtpVerifyRequest:
      type: object
      required:
      - phone
      - code
      - device_fingerprint
      properties:
        phone:
          type: string
          example: '+923001234567'
        code:
          type: string
          minLength: 4
          maxLength: 8
        device_fingerprint:
          type: string
    TokenPair:
      type: object
      properties:
        access_token:
          type: string
          readOnly: true
        refresh_token:
          type: string
          readOnly: true
        expires_in:
          type: integer
          example: 900
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        phone:
          type: string
        full_name:
          type:
          - string
          - 'null'
        language:
          type: string
          enum:
          - ur
          - ur-roman
          - en
        status:
          type: string
          enum:
          - active
          - suspended
          - banned
          readOnly: true
    Address:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        label:
          type: string
          enum:
          - home
          - work
          - other
        address_text:
          type:
          - string
          - 'null'
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
    AddressInput:
      type: object
      required:
      - label
      - lat
      - lng
      properties:
        label:
          type: string
          enum:
          - home
          - work
          - other
        address_text:
          type: string
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        parent_id:
          type:
          - string
          - 'null'
          format: uuid
        level:
          type: integer
          enum:
          - 1
          - 2
          - 3
        slug:
          type: string
          example: book-binding
        name_en:
          type: string
        name_ur:
          type:
          - string
          - 'null'
        name_roman:
          type:
          - string
          - 'null'
    ProviderCard:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        display_name:
          type: string
          maxLength: 100
        provider_type:
          type: string
          enum:
          - SHOP
          - INDIVIDUAL
          - TEAM
        tier:
          type: integer
          minimum: 0
          maximum: 3
        rating_bayes:
          type: number
          readOnly: true
        jobs_completed:
          type: integer
          readOnly: true
        distance_km:
          type: number
          readOnly: true
        eta_minutes:
          type:
          - integer
          - 'null'
          readOnly: true
        is_open_now:
          type: boolean
          readOnly: true
        starting_price:
          type:
          - number
          - 'null'
          readOnly: true
        sponsored:
          type: boolean
          default: false
          readOnly: true
      example:
        id: 5f6e6679-7425-40de-944b-e07fc1f90ae7
        display_name: Ahmed Book Binding
        provider_type: SHOP
        tier: 2
        rating_bayes: 4.7
        jobs_completed: 128
        distance_km: 1.2
        eta_minutes: 25
        is_open_now: true
        starting_price: 200
        sponsored: false
    FairRange:
      type: object
      properties:
        min:
          type: number
          minimum: 0
          description: Amount in PKR.
        typical:
          type: number
          minimum: 0
          description: Amount in PKR.
        max:
          type: number
          minimum: 0
          description: Amount in PKR.
        sample_size:
          type: integer
    CreateRequest:
      type: object
      description: Provide category_id (UUID) OR category_slug; if both are sent they must resolve to the same category or the API returns 422.
      properties:
        category_id:
          type: string
          format: uuid
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        category_slug:
          type: string
          example: book-binding
        description:
          type: string
          maxLength: 2000
          description: Free-text description of the work (max 2000 characters).
        specs:
          type: object
          additionalProperties: true
          example:
            books: 20
            size: A4
            binding: hard
        fulfillment:
          type: string
          enum:
          - VISIT_SHOP
          - PROVIDER_COMES
          - PICKUP_DELIVERY
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
        address_id:
          type:
          - string
          - 'null'
          format: uuid
        customer_offer:
          type:
          - number
          - 'null'
          description: Your offer in PKR. Null means "get quotes" - providers quote first.
        scheduled_at:
          type:
          - string
          - 'null'
          format: date-time
        photos:
          type: array
          maxItems: 5
          items:
            type: string
          description: Photo storage keys (upload first); at most 5 photos.
      required:
      - fulfillment
      - lat
      - lng
    ServiceRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        category_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - DRAFT
          - BROADCASTING
          - OFFERS_RECEIVED
          - ACCEPTED
          - EXPIRED
          - CANCELLED
          readOnly: true
        wave:
          type: integer
        fair_range:
          $ref: '#/components/schemas/FairRange'
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
          readOnly: true
    CreateOffer:
      type: object
      required:
      - price
      properties:
        price:
          type: number
          minimum: 0
          exclusiveMinimum: 0
          description: Amount in PKR. Must be greater than 0.
        eta_minutes:
          type:
          - integer
          - 'null'
        note:
          type:
          - string
          - 'null'
        breakdown:
          type:
          - object
          - 'null'
          properties:
            labour:
              type: number
              minimum: 0
              description: Amount in PKR.
            parts:
              type: number
              minimum: 0
              description: Amount in PKR.
            visit_fee:
              type: number
              minimum: 0
              description: Amount in PKR.
    CounterOffer:
      type: object
      required:
      - price
      properties:
        price:
          type: number
          minimum: 0
          exclusiveMinimum: 0
          description: Amount in PKR. Must be greater than 0.
        note:
          type:
          - string
          - 'null'
    Offer:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        request_id:
          type: string
          format: uuid
          readOnly: true
        provider_id:
          type: string
          format: uuid
          readOnly: true
        offered_by:
          type: string
          enum:
          - provider
          - customer
        round:
          type: integer
          minimum: 1
          maximum: 3
          readOnly: true
        price:
          type: number
          minimum: 0
          exclusiveMinimum: 0
          description: Amount in PKR. Must be greater than 0.
        eta_minutes:
          type:
          - integer
          - 'null'
        status:
          type: string
          enum:
          - pending
          - accepted
          - rejected
          - countered
          - expired
          - closed
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
      example:
        id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        request_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        provider_id: 5f6e6679-7425-40de-944b-e07fc1f90ae7
        offered_by: provider
        round: 1
        price: 2550
        eta_minutes: 60
        status: pending
        expires_at: '2026-11-17T03:00:00Z'
    Job:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        request_id:
          type: string
          format: uuid
          readOnly: true
        agreed_price:
          type: number
          minimum: 0
          exclusiveMinimum: 0
          description: Amount in PKR. Must be greater than 0.
          readOnly: true
        final_price:
          type:
          - number
          - 'null'
          readOnly: true
        state:
          $ref: '#/components/schemas/JobState'
          readOnly: true
        payment_method:
          type: string
          enum:
          - cash
          description: Phase 1 is cash only; wallet/escrow arrive in Phase 2.
        payment_status:
          type: string
          enum:
          - unpaid
          - settled
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      example:
        id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        request_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        agreed_price: 2550
        final_price: null
        state: ACCEPTED
        payment_method: cash
        payment_status: unpaid
    TransitionRequest:
      type: object
      required:
      - to_state
      properties:
        to_state:
          $ref: '#/components/schemas/JobState'
        lat:
          type:
          - number
          - 'null'
        lng:
          type:
          - number
          - 'null'
    Adjustment:
      type: object
      required:
      - items
      - reason
      - added_amount
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
              amount:
                type: number
                minimum: 0
                exclusiveMinimum: 0
                description: Amount in PKR. Must be greater than 0.
              photo_key:
                type:
                - string
                - 'null'
        reason:
          type: string
          maxLength: 2000
        added_amount:
          type: number
          minimum: 0
          exclusiveMinimum: 0
          description: Amount in PKR. Must be greater than 0.
    Review:
      type: object
      required:
      - stars
      properties:
        stars:
          type: integer
          minimum: 1
          maximum: 5
        tags:
          type: array
          items:
            type: string
          maxItems: 10
        comment:
          type:
          - string
          - 'null'
    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        chat_id:
          type: string
          format: uuid
          readOnly: true
        sender_id:
          type: string
          format: uuid
          readOnly: true
        kind:
          type: string
          enum:
          - text
          - image
          - voice
          - quick_reply
        body:
          type:
          - string
          - 'null'
        is_flagged:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      example:
        id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        chat_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        sender_id: 5f6e6679-7425-40de-944b-e07fc1f90ae7
        kind: text
        body: I am on my way.
        is_flagged: false
        created_at: '2026-11-17T02:50:00Z'
    MessageInput:
      type: object
      properties:
        kind:
          type: string
          enum:
          - text
          - image
          - voice
          - quick_reply
          default: text
        body:
          type:
          - string
          - 'null'
          maxLength: 2000
        media_key:
          type:
          - string
          - 'null'
    JobState:
      type: string
      enum:
      - ACCEPTED
      - PROVIDER_EN_ROUTE
      - CUSTOMER_EN_ROUTE
      - ITEM_PICKED_UP
      - ARRIVED
      - IN_PROGRESS
      - PRICE_ADJUSTMENT_PENDING
      - COMPLETED
      - PAYMENT_SETTLED
      - RATED
      - CANCELLED_BY_CUSTOMER
      - CANCELLED_BY_PROVIDER
      - EXPIRED
      - DISPUTED
      - REFUNDED
      description: Shared job state machine (PRD section 7). One schema, referenced by Job.state and TransitionRequest.to_state.
    VerificationItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        provider_id:
          type: string
          format: uuid
          readOnly: true
        doc_type:
          type: string
          enum:
          - cnic_front
          - cnic_back
          - selfie
          - shop_photo
          - certificate
        storage_key:
          type: string
          readOnly: true
        review_status:
          type: string
          enum:
          - pending
          - approved
          - rejected
          readOnly: true
        submitted_at:
          type: string
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
    Dispute:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        job_id:
          type: string
          format: uuid
          readOnly: true
        status:
          type: string
          enum:
          - open
          - under_review
          - resolved
          - rejected
          readOnly: true
        reason_code:
          type: string
          maxLength: 40
        description:
          type:
          - string
          - 'null'
          maxLength: 2000
        sla_first_response_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
        sla_resolve_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      example:
        id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        job_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        status: open
        reason_code: work_not_done
        sla_first_response_at: '2026-11-17T06:00:00Z'
        sla_resolve_at: '2026-11-19T06:00:00Z'
    DisputeInput:
      type: object
      required:
      - reason_code
      properties:
        reason_code:
          type: string
          maxLength: 40
          example: work_not_done
        description:
          type: string
          maxLength: 2000
    AuditLogEntry:
      type: object
      properties:
        id:
          type: string
        actor_id:
          type:
          - string
          - 'null'
          format: uuid
          readOnly: true
        action:
          type: string
          example: admin.verification.decide
        entity:
          type: string
          example: provider_document
        entity_id:
          type:
          - string
          - 'null'
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
    WaitlistRequest:
      type: object
      description: Provide category_id (UUID) OR category_slug; if both are sent they must resolve to the same category or the API returns 422.
      required:
      - lat
      - lng
      properties:
        category_id:
          type: string
          format: uuid
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        category_slug:
          type: string
          example: book-binding
        lat:
          type: number
          minimum: -90
          maximum: 90
          example: 30.1798
        lng:
          type: number
          minimum: -180
          maximum: 180
          example: 66.975
    WaitlistEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
