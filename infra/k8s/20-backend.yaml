# Near Service — backend API (NestJS).
#
# Maps to the `backend` service in docker-compose.yml:
#   NestJS on port 3000, global prefix /api/v1 (backend/src/main.ts),
#   DATABASE_URL + REDIS_URL, JWT/CNIC/OTP/encryption secrets, OTP_DEV_MODE,
#   PAYMENT_GATEWAY_MODE, CORS_ORIGINS, STORAGE_UPLOAD_BASE_URL.
#   Health: GET /api/v1/health (200 whenever the process is up) and
#   GET /api/v1/ready (200 only when Postgres + Redis both answer) —
#   backend/src/modules/health/health.controller.ts.
#
# Differences from dev:
#   - Image: replace `near-service-backend:latest` with the ECR repository
#     URL from `terraform output backend_ecr_repository_url` plus a tag
#     (CI pushes the image; Terraform only creates the repository).
#   - 2 replicas with a RollingUpdate (dev runs 1 container).
#   - Secrets come from the Secret (managed: synced from Secrets Manager
#     by the External Secrets Operator — see 02-secret.yaml), never from
#     hard-coded env values.
#   - NODE_ENV=production, OTP_DEV_MODE=false.
#   - No host port published — traffic enters only through the Ingress.
#   - Resource requests/limits and HTTP probes (dev used a node fetch
#     healthcheck against /api/v1/ready; here readiness is /api/v1/ready
#     and liveness is /api/v1/health).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: near-service
  labels:
    app.kubernetes.io/part-of: near-service
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: near-service
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          # REPLACE with the Terraform ECR output, e.g.
          # <account>.dkr.ecr.ap-south-1.amazonaws.com/near-service/backend:<tag>
          image: near-service-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: near-service-config
                  key: NODE_ENV
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: near-service-config
                  key: PORT
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: near-service-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: near-service-secrets
                  key: REDIS_URL
            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: near-service-secrets
                  key: JWT_ACCESS_SECRET
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: near-service-secrets
                  key: JWT_REFRESH_SECRET
            - name: CNIC_PEPPER
              valueFrom:
                secretKeyRef:
                  name: near-service-secrets
                  key: CNIC_PEPPER
            - name: OTP_HASH_SECRET
              valueFrom:
                secretKeyRef:
                  name: near-service-secrets
                  key: OTP_HASH_SECRET
            - name: FIELD_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: near-service-secrets
                  key: FIELD_ENCRYPTION_KEY
            - name: JWT_ACCESS_TTL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: near-service-config
                  key: JWT_ACCESS_TTL_SECONDS
            - name: JWT_REFRESH_TTL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: near-service-config
                  key: JWT_REFRESH_TTL_SECONDS
            - name: OTP_DEV_MODE
              valueFrom:
                configMapKeyRef:
                  name: near-service-config
                  key: OTP_DEV_MODE
            - name: OTP_TTL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: near-service-config
                  key: OTP_TTL_SECONDS
            - name: OTP_MAX_ATTEMPTS_PER_PHONE_PER_HOUR
              valueFrom:
                configMapKeyRef:
                  name: near-service-config
                  key: OTP_MAX_ATTEMPTS_PER_PHONE_PER_HOUR
            - name: COMMISSION_RATE_DEFAULT
              valueFrom:
                configMapKeyRef:
                  name: near-service-config
                  key: COMMISSION_RATE_DEFAULT
            - name: PAYMENT_GATEWAY_MODE
              valueFrom:
                configMapKeyRef:
                  name: near-service-config
                  key: PAYMENT_GATEWAY_MODE
            - name: STORAGE_UPLOAD_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: near-service-config
                  key: STORAGE_UPLOAD_BASE_URL
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: near-service-config
                  key: CORS_ORIGINS
          # Liveness: process up (no dependency checks — a DB blip must not
          # restart the pod; readiness below handles that).
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Readiness: Postgres + Redis both answer (same endpoint the dev
          # compose healthcheck used). Unready pods leave the Service.
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: near-service
  labels:
    app.kubernetes.io/part-of: near-service
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 3000
      targetPort: http
