# Near Service — admin panel (Next.js).
#
# Maps to the `admin` service in docker-compose.yml:
#   Next.js (output: "standalone", `node server.js`), NEXT_PUBLIC_API_URL
#   pointing at the API, port 3001 everywhere (Fix C — resolved
#   2026-11-17: package.json `next start -p 3001`, Dockerfile PORT=3001,
#   compose 3001:3001, this manifest containerPort/Service 3001, Ingress
#   service port 3001). The old 3000/3001 split is gone.
#
# Differences from dev:
#   - Image: replace `near-service-admin:latest` with the ECR repository URL
#     from `terraform output admin_ecr_repository_url` plus a tag.
#     The image is built by CI from admin/Dockerfile (see
#     .github/workflows/ci.yml, docker-build job).
#   - 2 replicas with a RollingUpdate (dev runs 1 container).
#   - No host port published — traffic enters only through the Ingress.
#   - Resource requests/limits and HTTP probes on / (Next.js has no
#     dedicated health endpoint; / returns 200 when the server is up).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: near-service
  labels:
    app.kubernetes.io/part-of: near-service
    app.kubernetes.io/component: admin
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: admin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: admin
        app.kubernetes.io/part-of: near-service
        app.kubernetes.io/component: admin
    spec:
      containers:
        - name: admin
          # REPLACE with the Terraform ECR output, e.g.
          # <account>.dkr.ecr.ap-south-1.amazonaws.com/near-service/admin:<tag>
          image: near-service-admin:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: NEXT_PUBLIC_API_URL
              valueFrom:
                configMapKeyRef:
                  name: near-service-config
                  key: NEXT_PUBLIC_API_URL
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: admin
  namespace: near-service
  labels:
    app.kubernetes.io/part-of: near-service
    app.kubernetes.io/component: admin
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: admin
  ports:
    - name: http
      port: 3001
      targetPort: http
