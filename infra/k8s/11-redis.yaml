# Near Service — Redis (self-hosted path).
#
# CHOOSE ONE data path — do not run both:
#   (a) MANAGED (recommended): ElastiCache from infra/terraform/. Then DO
#       NOT apply this file, and point REDIS_URL at ElastiCache (Terraform
#       writes it into Secrets Manager; see 02-secret.yaml).
#   (b) SELF-HOSTED: apply this file. One replica, AOF persistence on a
#       persistent volume (appendonly, so OTP rate-limit counters and
#       sessions survive a pod restart). No clustering — Redis Cluster /
#       Sentinel HA is out of scope for this item.
#
# Maps to the `redis` service in docker-compose.yml: redis:7-alpine,
# redis-cli ping healthcheck, no published host port, resource limits.
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: near-service
  labels:
    app.kubernetes.io/part-of: near-service
    app.kubernetes.io/component: redis
spec:
  clusterIP: None # headless — stable DNS redis.near-service.svc.cluster.local
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: near-service
  labels:
    app.kubernetes.io/part-of: near-service
    app.kubernetes.io/component: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: near-service
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - name: redis
              containerPort: 6379
          # Dev compose used `redis-cli ping` as the healthcheck; same here.
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: redisdata
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: redisdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
