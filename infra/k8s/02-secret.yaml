# Near Service — secrets (PLACEHOLDER ONLY).
#
# !!! DO NOT APPLY THIS FILE WITH THESE VALUES !!!
# Every value below is the literal string REPLACE_ME_*. Applying it would
# start the backend with fake secrets and a fake database password, and the
# backend would refuse to boot in production (CNIC_PEPPER / OTP_HASH_SECRET
# must be >= 32 chars and must not contain "change-me"; FIELD_ENCRYPTION_KEY
# must be base64 of exactly 32 bytes).
#
# PRODUCTION PATH (recommended): do NOT apply this file at all. Install the
# External Secrets Operator and create an ExternalSecret that syncs the
# AWS Secrets Manager secret created by Terraform (output `app_secrets_arn`,
# keys: DATABASE_URL, REDIS_URL, POSTGRES_PASSWORD, JWT_ACCESS_SECRET,
# JWT_REFRESH_SECRET, CNIC_PEPPER, OTP_HASH_SECRET, FIELD_ENCRYPTION_KEY)
# into a Kubernetes Secret named `near-service-secrets` in this namespace.
# The Deployments below already reference that name — nothing else changes.
# See k8s/README.md for the exact ExternalSecret YAML.
#
# SELF-HOSTED / quick-test path: copy this file, replace every REPLACE_ME_*
# with a real generated value (see infra/terraform/variables.tf for the
# generation commands), and apply the copy. Never commit the filled copy.
---
apiVersion: v1
kind: Secret
metadata:
  name: near-service-secrets
  namespace: near-service
  labels:
    app.kubernetes.io/part-of: near-service
type: Opaque
stringData:
  # Full connection strings. Managed path: Terraform writes these into
  # Secrets Manager from the RDS/ElastiCache endpoints + generated password.
  # Self-hosted path: postgres/redis are the in-cluster Service names and
  # POSTGRES_PASSWORD must match the value in this same Secret.
  DATABASE_URL: "postgres://nearservice:REPLACE_ME_DB_PASSWORD@postgres:5432/nearservice"
  REDIS_URL: "redis://redis:6379"
  POSTGRES_PASSWORD: "REPLACE_ME_DB_PASSWORD"
  # App secrets — generate fresh values; never reuse the dev values from
  # docker-compose.yml (dev_access_secret_change_me, etc.).
  JWT_ACCESS_SECRET: "REPLACE_ME_GENERATE_32_PLUS_CHARS"
  JWT_REFRESH_SECRET: "REPLACE_ME_GENERATE_32_PLUS_CHARS_DIFFERENT_FROM_ACCESS"
  CNIC_PEPPER: "REPLACE_ME_GENERATE_32_PLUS_CHARS"
  OTP_HASH_SECRET: "REPLACE_ME_GENERATE_32_PLUS_CHARS"
  FIELD_ENCRYPTION_KEY: "REPLACE_ME_BASE64_OF_32_BYTES"
